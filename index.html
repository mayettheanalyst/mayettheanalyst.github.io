<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data That Drives Growth | Portfolio</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body { 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
      background: #0a0a0a; 
      color: #fafafa; 
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Animated Background Grid */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .container { 
      max-width: 1100px; 
      margin: 0 auto; 
      padding: 3rem 2rem;
      position: relative;
      z-index: 1;
    }
    
    /* Hero with Dynamic Elements */
    header { 
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;      align-items: center;
      text-align: center;
      position: relative;
    }

    /* Floating Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 20s infinite ease-in-out;
      z-index: -1;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      top: 10%;
      left: -10%;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      bottom: 10%;
      right: -5%;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      top: 50%;
      right: 10%;
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 30px) scale(0.9); }
    }

    /* Name with Reveal Animation */
    h1 {       font-size: 4rem; 
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: revealUp 1s ease-out forwards;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline { 
      color: #94a3b8; 
      font-size: 1.3rem; 
      max-width: 650px; 
      margin: 0 auto 2.5rem;
      opacity: 0;
      animation: revealUp 1s ease-out 0.2s forwards;
      line-height: 1.7;
    }

    /* Dynamic Button */
    .cta-button { 
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: #fff;
      padding: 1rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      text-decoration: none; 
      font-weight: 600; 
      font-size: 1rem;
      overflow: hidden;
      opacity: 0;
      animation: revealUp 1s ease-out 0.4s forwards;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;      background: linear-gradient(90deg, #667eea, #764ba2);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }

    .cta-button:hover {
      border-color: transparent;
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(102, 126, 234, 0.4);
    }

    .cta-button:hover::before {
      opacity: 1;
    }

    .cta-button::after {
      content: '→';
      transition: transform 0.3s ease;
    }

    .cta-button:hover::after {
      transform: translateX(5px);
    }

    /* Scroll Indicator */
    .scroll-indicator {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      animation: fadeIn 1s ease-out 1s forwards, bounce 2s infinite;
    }

    .scroll-indicator::before {
      content: '';
      display: block;
      width: 24px;
      height: 40px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      position: relative;
    }

    .scroll-indicator::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;      transform: translateX(-50%);
      width: 4px;
      height: 8px;
      background: rgba(255,255,255,0.6);
      border-radius: 2px;
      animation: scrollDown 2s infinite;
    }

    @keyframes revealUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }

    @keyframes scrollDown {
      0% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(15px); }
    }

    /* Mobile */
    @media (max-width: 768px) { 
      h1 { font-size: 2.5rem; }
      .tagline { font-size: 1.1rem; }
      .orb { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  
  <div class="container">
    <header>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
            <h1>MayetTheAnalyst</h1>
      <p class="tagline">I turn raw data into clear growth strategies for creators & businesses. See what data can actually do.</p>
      <a href="#projects" class="cta-button">See My Work</a>
      
      <div class="scroll-indicator"></div>
    </header>
  </div>
</body>
</html>
